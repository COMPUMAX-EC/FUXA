# Fork-only CI (COMPUMAX-EC/FUXA): not part of upstream PRs.
name: fork server tests
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Modbus write-script tests
        run: npx mocha test/devices/modbusScriptBytes.test.js --timeout 10000
      - name: Full server suite
        run: npm test
